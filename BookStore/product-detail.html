
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <section id="product-detail-page" class="page-section container">
        <div class="detail-wrapper">
          <div class="detail-gallery">
            <div class="main-image">
              <img id="detailMainImg" src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600" alt="Main Book">
            </div>
            <div class="thumbs">
              <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=150" onclick="changeDetailImg(this.src)">
              <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=150" onclick="changeDetailImg(this.src)">
              <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=150" onclick="changeDetailImg(this.src)">
            </div>
          </div>
          <div class="detail-info">
            <h2>H.G. Wells De Vengeance</h2>
            <p class="author">Author: <span>H.G. Wells</span> | Category: <span>Literature</span></p>
            <div class="price-row left"><span class="price big">£51.20</span><span class="old-price">£65.00</span></div>
            <p class="desc">High-quality hardcover edition featuring summary and analysis notes for literature enthusiasts.</p>
            <div class="actions">
              <input type="number" id="prodQty" value="1" min="1">
              <button class="btn-green" onclick="addToCart()">Add to Cart</button>
            </div>
          </div>
        </div>
      </section>
    <script src="./assets/js/products.js"></script>
</body>
</html>
