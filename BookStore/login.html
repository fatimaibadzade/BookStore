<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Document</title>
</head>

<body class="auth-page">
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="logo" href="index.html">Book<span>Nest</span></a>
            <a class="text-link" href="index.html">← Back to home</a>
        </div>
    </header>

    <main class="auth-wrapper">
        <form class="auth-card" id="loginForm" novalidate>
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Login to your account</h1>
            <p class="muted">Continue your reading journey.</p>

            <label for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
            <small class="field-error" id="loginEmailError"></small>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <small class="field-error" id="loginPasswordError"></small>

            <button type="submit" class="btn btn-primary btn-full">Login</button>
            <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
            <p class="form-message" id="loginMessage" role="status"></p>
            <p class="demo-note">Demo project: account data is stored in this browser only.</p>
        </form>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
</body>

</html>
