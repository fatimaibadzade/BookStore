
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <section id="auth-page" class="page-section container">
        <div class="auth-box">
          <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuth('login')">Login</button>
            <button class="auth-tab" onclick="switchAuth('register')">Register</button>
          </div>
          <form id="loginForm" class="auth-form active" onsubmit="event.preventDefault(); alert('Login successful!');">
            <h3>Welcome Back</h3>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn-green">Login</button>
          </form>
          <form id="registerForm" class="auth-form" onsubmit="event.preventDefault(); alert('Registration successful!');">
            <h3>Create Account</h3>
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn-green">Register</button>
          </form>
        </div>
      </section>
      
     <script src="./assets/js/auth.js"></script>
</body>
</html>
