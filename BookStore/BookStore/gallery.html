<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pustok - Gallery</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

 
  <header class="header">
    <div class="container header-top">
      <div class="logo"><a href="index.html">Pustok<span>.</span></a></div>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" class="nav-link">HOME</a></li>
          <li><a href="product-detail.html" class="nav-link">PRODUCT DETAIL</a></li>
          <li><a href="gallery.html" class="nav-link active">GALLERY</a></li>
          <li><a href="login-register.html" class="nav-link">LOGIN / REGISTER</a></li>
          <li><a href="presentation.html" class="nav-link">TEQDIMAT Q&A</a></li>
        </ul>
      </nav>
    </div>
  </header>

   <main class="container" style="padding: 50px 15px;">
    <h2 class="section-title">BOOK & ART GALLERY</h2>

     <div class="gallery-filters" style="display: flex; justify-content: center; gap: 15px; margin-bottom: 30px;">
      <button class="filter-btn active" onclick="filterGallery('all')">All</button>
      <button class="filter-btn" onclick="filterGallery('classic')">Classic</button>
      <button class="filter-btn" onclick="filterGallery('art')">Art & Design</button>
      <button class="filter-btn" onclick="filterGallery('fiction')">Fiction</button>
    </div>

     <div class="gallery-grid">
      <div class="gallery-item item-classic">
        <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400" alt="Gallery">
        <h4>Classic Literature</h4>
      </div>
      <div class="gallery-item item-art">
        <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400" alt="Gallery">
        <h4>Design & Art Edition</h4>
      </div>
      <div class="gallery-item item-fiction">
        <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400" alt="Gallery">
        <h4>Fiction & Novels</h4>
      </div>
      <div class="gallery-item item-art">
        <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400" alt="Gallery">
        <h4>Photography Collections</h4>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-main">
      <div><h2 class="footer-logo">Pustok<span>.</span></h2></div>
    </div>
  </footer>

  <script src="./assets/js/script.js"></script>
</body>
</html>
